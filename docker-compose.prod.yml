# Production deployment for elearning-website
# Used by Jenkins pipeline or manual deployment
#
# Manual usage:
#   docker compose -f docker-compose.prod.yml up -d

networks:
  traefik:
    external: true

services:
  elearning:
    build: .
    image: elearning:latest
    container_name: elearning
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.elearning.rule=Host(`elearning-demo.nihilanth.co.uk`)
      - traefik.http.routers.elearning.entrypoints=websecure
      - traefik.http.routers.elearning.tls.certresolver=letsencrypt
      - traefik.http.services.elearning.loadbalancer.server.port=3000
